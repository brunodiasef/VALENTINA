<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>A.B.C. da Valentina</title>
<meta name="theme-color" content="#2AA9A0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="A.B.C. Valentina">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --sky: #EAF4FB;
    --sky-deep: #D3EAF7;
    --teal: #2AA9A0;
    --teal-dark: #1D8078;
    --coral: #FF8C6B;
    --coral-dark: #E86F4C;
    --sun: #FFC94D;
    --sun-dark: #E8A800;
    --ink: #2B3A45;
    --ink-soft: #5A6B75;
    --white: #FFFFFF;
    --card-shadow: 0 10px 24px rgba(43,58,69,0.12);
    --radius-lg: 32px;
    --radius-md: 24px;
    --radius-sm: 16px;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;height:100%;
    font-family:'Nunito', system-ui, -apple-system, 'Segoe UI', sans-serif;
    background:var(--sky);
    color:var(--ink);
    -webkit-tap-highlight-color:transparent;
    overscroll-behavior:none;
  }
  h1,h2,h3,.display{
    font-family:'Baloo 2', system-ui, sans-serif;
    font-weight:700;
    margin:0;
  }
  button{font-family:inherit;}
  #app{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:20px 16px 100px;
    position:relative;
  }
  .screen{
    width:100%;
    max-width:720px;
    display:flex;
    flex-direction:column;
    align-items:center;
    animation:fadeIn .35s ease;
  }
  @keyframes fadeIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
  @media (prefers-reduced-motion: reduce){
    .screen{animation:none;}
    *{transition:none !important;animation-duration:0.001s !important;}
  }

  /* ---- Top nav bar ---- */
  .topbar{
    width:100%;
    max-width:720px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    margin-bottom:18px;
    flex-wrap:wrap;
  }
  .nav-btn{
    display:flex;
    align-items:center;
    gap:8px;
    background:var(--white);
    border:none;
    border-radius:999px;
    padding:14px 22px;
    font-size:1.05rem;
    font-weight:700;
    color:var(--ink);
    box-shadow:var(--card-shadow);
    cursor:pointer;
    min-height:56px;
    touch-action:manipulation;
  }
  .nav-btn:active{transform:scale(0.96);}
  .nav-btn.icon-only{padding:14px;width:56px;justify-content:center;}
  .nav-spacer{flex:1;}

  /* ---- Generic big button ---- */
  .big-btn{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;
    background:var(--teal);
    color:var(--white);
    border:none;
    border-radius:999px;
    padding:22px 40px;
    font-size:1.5rem;
    font-weight:700;
    font-family:'Baloo 2',sans-serif;
    box-shadow:0 8px 0 var(--teal-dark);
    cursor:pointer;
    min-height:72px;
    touch-action:manipulation;
    transition:transform .08s ease;
  }
  .big-btn:active{transform:translateY(6px);box-shadow:0 2px 0 var(--teal-dark);}
  .big-btn.coral{background:var(--coral);box-shadow:0 8px 0 var(--coral-dark);}
  .big-btn.coral:active{box-shadow:0 2px 0 var(--coral-dark);}
  .big-btn.sun{background:var(--sun);color:#5A4200;box-shadow:0 8px 0 var(--sun-dark);}
  .big-btn.sun:active{box-shadow:0 2px 0 var(--sun-dark);}
  .big-btn.small{padding:16px 28px;font-size:1.15rem;min-height:60px;box-shadow:0 6px 0 var(--teal-dark);}

  /* ---- Start screen ---- */
  .start-card{
    background:var(--white);
    border-radius:var(--radius-lg);
    box-shadow:var(--card-shadow);
    padding:36px 28px;
    text-align:center;
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:14px;
    margin-top:6vh;
  }
  .start-card-photo{
    width:100%;
    max-width:260px;
    aspect-ratio:1/1;
    border-radius:var(--radius-md);
    background-size:cover;
    background-position:center;
    box-shadow:var(--card-shadow);
  }
  .start-card-content{
    position:relative;
    z-index:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
  }
  .app-title{
    font-size:1.7rem;
    color:var(--teal-dark);
    line-height:1.2;
  }
  .hello{
    font-size:2.1rem;
    color:var(--coral-dark);
  }
  .subtitle{font-size:1.1rem;color:var(--ink-soft);font-weight:600;}
  .school-name{font-size:1rem;color:var(--ink-soft);font-weight:700;letter-spacing:.3px;}
  .teacher-line{font-size:.95rem;color:var(--ink-soft);margin-top:8px;}
  .star-row{font-size:1.8rem;letter-spacing:6px;}

  /* ---- Menu cards ---- */
  .menu-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:18px;
    width:100%;
  }
  @media (max-width:520px){ .menu-grid{grid-template-columns:1fr;} }
  .menu-card{
    background:var(--white);
    border-radius:var(--radius-lg);
    box-shadow:var(--card-shadow);
    padding:28px 20px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
    text-align:center;
    cursor:pointer;
    border:none;
    min-height:170px;
    justify-content:center;
    touch-action:manipulation;
  }
  .menu-card:active{transform:scale(0.97);}
  .menu-card .emoji{font-size:3rem;}
  .menu-card .title{font-family:'Baloo 2',sans-serif;font-size:1.25rem;color:var(--ink);}
  .menu-card .desc{font-size:.95rem;color:var(--ink-soft);font-weight:600;}

  /* ---- Activity card ---- */
  .activity-card{
    background:var(--white);
    border-radius:var(--radius-lg);
    box-shadow:var(--card-shadow);
    padding:36px 24px;
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:22px;
  }
  .prompt{
    font-family:'Baloo 2',sans-serif;
    font-size:1.6rem;
    text-align:center;
    color:var(--teal-dark);
  }
  .stimulus{
    font-family:'Baloo 2',sans-serif;
    font-weight:700;
    font-size:clamp(2.2rem, 11vw, 5rem);
    line-height:1.15;
    word-break:break-word;
    max-width:100%;
    text-align:center;
    letter-spacing:1px;
  }
  .stimulus.word-photo{
    display:block;
    max-width:min(70vw, 260px);
    max-height:220px;
    width:auto;
    height:auto;
    object-fit:contain;
    margin:0 auto;
    border-radius:var(--radius-md);
  }
  .word-photo{
    object-fit:contain;
    -webkit-user-drag:none;
  }
  .menu-card .word-photo{
    width:64px;
    height:64px;
  }
  .option-btn img.word-photo{
    width:72px;
    height:72px;
    display:block;
  }
  .evolucao-row .word-photo{
    width:32px;
    height:32px;
    vertical-align:middle;
    margin-right:6px;
  }
  .word-display{
    font-family:'Baloo 2',sans-serif;
    font-size:3rem;
    letter-spacing:4px;
    color:var(--ink);
    background:var(--sky-deep);
    border-radius:var(--radius-md);
    padding:14px 28px;
  }
  .options-row{
    display:flex;
    flex-wrap:wrap;
    gap:16px;
    justify-content:center;
    width:100%;
  }
  .option-btn{
    background:var(--white);
    border:4px solid var(--sky-deep);
    border-radius:var(--radius-md);
    padding:22px 30px;
    font-family:'Baloo 2',sans-serif;
    font-size:1.8rem;
    color:var(--ink);
    cursor:pointer;
    min-width:110px;
    min-height:88px;
    box-shadow:var(--card-shadow);
    touch-action:manipulation;
  }
  .option-btn:active{transform:scale(0.95);}
  .option-btn.correct{background:#DFF6E3;border-color:#7CD68C;}
  .option-btn.wrong{background:#FDE7E1;border-color:#F3AE96;}
  .option-btn.big-letter{
    font-size:clamp(2.2rem, 11vw, 5rem);
    min-width:96px;
    min-height:96px;
    padding:14px 26px;
  }

  .audio-btn{
    background:var(--sun);
    border:none;
    border-radius:999px;
    width:84px;height:84px;
    font-size:2.2rem;
    box-shadow:0 6px 0 var(--sun-dark);
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    touch-action:manipulation;
  }
  .audio-btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--sun-dark);}

  /* ---- Letter tiles (montar nome/palavra) ---- */
  .tiles-row{
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    justify-content:center;
  }
  .letter-tile{
    background:var(--coral);
    color:var(--white);
    border:none;
    border-radius:var(--radius-sm);
    width:64px;height:72px;
    font-family:'Baloo 2',sans-serif;
    font-size:2rem;
    box-shadow:0 6px 0 var(--coral-dark);
    cursor:pointer;
    touch-action:manipulation;
  }
  .letter-tile:active{transform:translateY(4px);box-shadow:0 2px 0 var(--coral-dark);}
  .letter-tile.used{visibility:hidden;}
  .target-row{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    justify-content:center;
    min-height:76px;
  }
  .target-slot{
    width:56px;height:64px;
    border-radius:14px;
    background:var(--sky-deep);
    border:3px dashed #B7D8EA;
    display:flex;align-items:center;justify-content:center;
    font-family:'Baloo 2',sans-serif;
    font-size:1.8rem;
    color:var(--teal-dark);
  }

  /* ---- Puzzle (drag-and-drop, real interlocking jigsaw shapes) ---- */
  .puzzle-board{
    display:flex;
    gap:6px;
    flex-wrap:wrap;
    justify-content:center;
    min-height:100px;
    padding:14px;
  }
  .puzzle-slot{
    position:relative;
    touch-action:none;
  }
  .puzzle-slot svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;}
  .puzzle-slot .socket-path{
    fill:rgba(255,255,255,.55);
    stroke:#B7D8EA;
    stroke-width:3;
    stroke-dasharray:7 6;
    transition:stroke .15s, fill .15s, opacity .15s;
  }
  .puzzle-slot.hover-target .socket-path{
    stroke:var(--sun-dark);
    fill:#FFF3D6;
  }
  .puzzle-slot.filled .socket-path{opacity:0;}
  .puzzle-tray{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    justify-content:center;
    min-height:110px;
    padding:16px 10px;
    background:var(--sky);
    border-radius:var(--radius-md);
    width:100%;
  }
  .puzzle-piece{
    position:relative;
    background:transparent;
    border:none;
    padding:0;
    cursor:grab;
    touch-action:none;
    user-select:none;
    filter:drop-shadow(0 5px 0 rgba(0,0,0,.18));
  }
  .puzzle-piece svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;}
  .puzzle-piece .piece-path{
    stroke:#2B2420;
    stroke-width:3.5;
    stroke-linejoin:round;
  }
  .puzzle-piece .piece-letter{
    position:absolute;inset:0;
    display:flex;align-items:center;justify-content:center;
    font-family:'Baloo 2',sans-serif;
    font-weight:800;
    font-size:1.9rem;
    pointer-events:none;
  }
  .puzzle-piece.placed{
    cursor:default;
    filter:none;
  }
  .puzzle-piece.dragging{
    filter:drop-shadow(0 14px 16px rgba(0,0,0,0.3));
    transform:scale(1.08);
    cursor:grabbing;
  }
  .target-slot.filled{border-style:solid;background:#DFF6E3;border-color:#7CD68C;}

  /* ---- Feedback overlay ---- */
  .feedback-banner{
    font-family:'Baloo 2',sans-serif;
    font-size:1.5rem;
    text-align:center;
    color:var(--teal-dark);
    background:#DFF6E3;
    border-radius:var(--radius-md);
    padding:16px 24px;
    min-height:24px;
  }
  .feedback-banner.hide{visibility:hidden;}
  .feedback-banner.retry{background:#FFF3D6;color:#8A6300;}

  /* ---- Tracing ---- */
  .tracing-wrap{
    position:relative;
    width:100%;
    max-width:520px;
    aspect-ratio:1/1;
    background:var(--sky-deep);
    border-radius:var(--radius-md);
    touch-action:none;
    overflow:hidden;
  }
  .tracing-wrap canvas{
    position:absolute;
    top:0;left:0;
    width:100%;height:100%;
  }
  .progress-bar-outer{
    width:100%;
    background:var(--sky-deep);
    border-radius:999px;
    height:22px;
    overflow:hidden;
  }
  .progress-bar-inner{
    height:100%;
    background:var(--sun);
    width:0%;
    transition:width .2s ease;
  }

  /* ---- Evolucao ---- */
  .evolucao-list{width:100%;display:flex;flex-direction:column;gap:14px;}
  .evolucao-row{
    background:var(--white);
    border-radius:var(--radius-md);
    box-shadow:var(--card-shadow);
    padding:18px 22px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    flex-wrap:wrap;
  }
  .evolucao-row .label{font-family:'Baloo 2',sans-serif;font-size:1.2rem;}
  .evolucao-row .stars{font-size:1.4rem;color:var(--sun-dark);letter-spacing:2px;}

  /* ---- Teacher area ---- */
  .teacher-panel{
    background:var(--white);
    border-radius:var(--radius-lg);
    box-shadow:var(--card-shadow);
    padding:28px 22px;
    width:100%;
    display:flex;
    flex-direction:column;
    gap:16px;
  }
  .teacher-panel h3{font-family:'Baloo 2',sans-serif;color:var(--teal-dark);}
  .pin-input{
    font-size:1.6rem;
    text-align:center;
    letter-spacing:8px;
    padding:14px;
    border-radius:14px;
    border:3px solid var(--sky-deep);
    width:200px;
    margin:0 auto;
  }
  table{width:100%;border-collapse:collapse;font-size:.95rem;}
  th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--sky-deep);}
  th{color:var(--ink-soft);font-size:.85rem;text-transform:uppercase;}
  .word-manage-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--sky);border-radius:14px;padding:10px 14px;}
  .word-manage-row input{padding:10px;border-radius:10px;border:2px solid var(--sky-deep);font-size:1rem;}
  .word-manage-row input.txt{width:120px;text-transform:uppercase;}
  .word-manage-row input.emoji{width:60px;text-align:center;}
  .small-btn{
    background:var(--teal);color:#fff;border:none;border-radius:10px;padding:10px 16px;font-weight:700;cursor:pointer;
  }
  .small-btn.danger{background:#E86F4C;}
  .field-row{display:flex;flex-direction:column;gap:6px;}
  label{font-weight:700;color:var(--ink-soft);font-size:.9rem;}
  select,input[type=text]{font-size:1rem;padding:10px;border-radius:10px;border:2px solid var(--sky-deep);}

  .footer-space{height:20px;}
</style>
</head>

<div id="app"></div>

// ---------- Persistence helpers ----------
function loadJSON(key, fallback){
  try{
    const raw = localStorage.getItem(key);
    if(!raw) return fallback;
    return JSON.parse(raw);
  }catch(e){ return fallback; }
}
function saveJSON(key, val){
  try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){}
}

let words = loadJSON(WORDS_KEY, DEFAULT_WORDS);
let progress = loadJSON(STORAGE_KEY, { stars:{ NOME:0 }, activities:{} });
let settings = loadJSON(SETTINGS_KEY, { audioOn:true, pin:"1234", tolerance:34 });

function persistAll(){
  saveJSON(WORDS_KEY, words);
  saveJSON(STORAGE_KEY, progress);
  saveJSON(SETTINGS_KEY, settings);
}

// ---------- PWA (installable app) ----------
// Everything here is generated at runtime from data already embedded in
// this single HTML file, so the app stays fully self-contained: no
// separate manifest.json or service-worker.js files are needed on disk.
let deferredInstallPrompt = null;
let appIsInstalled = false;

function isStandaloneDisplay(){
  return (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) ||
         window.navigator.standalone === true;
}
function isIOSDevice(){
  return /iphone|ipad|ipod/i.test(window.navigator.userAgent);
}

function setupPWA(){
  try{
    const manifest = {
      name: "A.B.C. da Valentina",
      short_name: "ABC Valentina",
      description: "Aplicativo pedagógico para Valentina aprender seu nome e palavras.",
      start_url: ".",
      scope: ".",
      display: "standalone",
      background_color: "#EAF4FB",
      theme_color: "#2AA9A0",
      orientation: "any",
      icons: [
        { src: ICON_192, sizes: "192x192", type: "image/jpeg", purpose: "any maskable" },
        { src: ICON_512, sizes: "512x512", type: "image/jpeg", purpose: "any maskable" }
      ]
    };
    const manifestBlob = new Blob([JSON.stringify(manifest)], {type:"application/manifest+json"});
    const manifestLink = document.createElement("link");
    manifestLink.rel = "manifest";
    manifestLink.href = URL.createObjectURL(manifestBlob);
    document.head.appendChild(manifestLink);

    const touchIcon = document.createElement("link");
    touchIcon.rel = "apple-touch-icon";
    touchIcon.href = ICON_192;
    document.head.appendChild(touchIcon);

    if("serviceWorker" in navigator){
      const swCode = "" +
        "const CACHE_NAME = 'abc-valentina-v2';" +
        "self.addEventListener('install', (event) => { self.skipWaiting(); });" +
        "self.addEventListener('activate', (event) => {" +
        "  event.waitUntil(" +
        "    caches.keys().then((keys) => Promise.all(keys.filter((k) => k !== CACHE_NAME).map((k) => caches.delete(k))))" +
        "  );" +
        "  self.clients.claim();" +
        "});" +
        "self.addEventListener('fetch', (event) => {" +
        "  if(event.request.method !== 'GET') return;" +
        // Network-first: always prefer the freshest deployed version when
        // online (so updates/bug fixes reach every device immediately),
        // and only fall back to the cached copy when the network fails
        // (offline use).
        "  event.respondWith(" +
        "    fetch(event.request).then((networkResponse) => {" +
        "      caches.open(CACHE_NAME).then((cache) => cache.put(event.request, networkResponse.clone()));" +
        "      return networkResponse;" +
        "    }).catch(() => caches.match(event.request))" +
        "  );" +
        "});";
      const swBlob = new Blob([swCode], {type:"application/javascript"});
      const swUrl = URL.createObjectURL(swBlob);
      navigator.serviceWorker.register(swUrl).catch(()=>{});
    }
  }catch(e){}

  window.addEventListener("beforeinstallprompt", (e)=>{
    e.preventDefault();
    deferredInstallPrompt = e;
    if(currentScreen === "start") render();
  });
  window.addEventListener("appinstalled", ()=>{
    appIsInstalled = true;
    deferredInstallPrompt = null;
    if(currentScreen === "start") render();
  });
  if(isStandaloneDisplay()) appIsInstalled = true;
}
setupPWA();

function addStar(itemId){
  const cur = progress.stars[itemId] || 0;
  progress.stars[itemId] = Math.min(5, cur + 1);
  persistAll();
}
function markActivityDone(key){
  progress.activities[key] = (progress.activities[key]||0) + 1;
  persistAll();
}

// ---------- Audio ----------
let cachedVoice = null;
function pickFemalePtVoice(){
  try{
    if(!window.speechSynthesis) return null;
    const voices = window.speechSynthesis.getVoices() || [];
    if(voices.length===0) return null;
    const pt = voices.filter(v => v.lang && v.lang.toLowerCase().startsWith("pt"));
    const pool = pt.length ? pt : voices;
    const femaleNamePattern = /maria|luciana|joana|helena|camila|fernanda|female|mulher|feminin|woman|samantha|vitoria|vitória/i;
    let voice = pool.find(v => femaleNamePattern.test(v.name));
    if(!voice) voice = pt.find(v => v.lang.toLowerCase()==="pt-br");
    if(!voice) voice = pt[0];
    return voice || null;
  }catch(e){ return null; }
}
function ensureVoiceReady(){
  try{
    if(!window.speechSynthesis) return;
    const existing = window.speechSynthesis.getVoices();
    if(existing && existing.length){
      cachedVoice = pickFemalePtVoice();
    }
    window.speechSynthesis.onvoiceschanged = ()=>{
      cachedVoice = pickFemalePtVoice();
    };
  }catch(e){}
}
ensureVoiceReady();

function speak(text){
  if(!settings.audioOn) return Promise.resolve();
  if(!window.speechSynthesis) return Promise.resolve();
  return new Promise((resolve)=>{
    let settled = false;
    const finish = ()=>{ if(settled) return; settled = true; resolve(); };
    // Safety net: on some devices (e.g. managed school Chromebooks with no
    // TTS engine/voice installed) speechSynthesis silently does nothing and
    // never fires onend/onerror, which would otherwise leave callers stuck
    // waiting forever (e.g. the start button never advancing).
    const safetyTimer = setTimeout(finish, 4000);
    try{
      const u = new SpeechSynthesisUtterance(text);
      u.lang = "pt-BR";
      u.rate = 0.85;
      u.pitch = 1.15;
      const voice = cachedVoice || pickFemalePtVoice();
      if(voice){ u.voice = voice; cachedVoice = voice; }
      u.onend = ()=>{ clearTimeout(safetyTimer); finish(); };
      u.onerror = ()=>{ clearTimeout(safetyTimer); finish(); };
      window.speechSynthesis.speak(u);
    }catch(e){ clearTimeout(safetyTimer); finish(); }
  });
}
function stopSpeaking(){
  try{ window.speechSynthesis.cancel(); }catch(e){}
}
// Small pause after speech ends (or, if audio is off, a longer pause so
// the on-screen feedback text still has time to be read) before moving on.
function afterFeedbackPause(){
  return new Promise((resolve)=> setTimeout(resolve, settings.audioOn ? 450 : 1000));
}

// ---------- Utility ----------
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
function pickDistractors(pool, excludeText, count){
  const options = pool.filter(w=>w.text!==excludeText);
  return shuffle(options).slice(0,count);
}
function el(tag, cls, html){
  const e = document.createElement(tag);
  if(cls) e.className = cls;
  if(html!==undefined) e.innerHTML = html;
  return e;
}

// Renders a word's picture: a real transparent-background photo when we have
// one (all built-in words), falling back to the teacher-typed emoji for any
// custom word added later without a photo on file.
function wordVisual(word, cls){
  if(word.img){
    const img = document.createElement("img");
    img.src = word.img;
    img.alt = word.text;
    img.className = (cls || "") + " word-photo";
    img.draggable = false;
    return img;
  }
  return el("span", cls, word.emoji);
}
// HTML-string version for spots that build text via innerHTML (e.g. prompt labels)
function wordVisualHTML(word){
  if(word.img){
    return '<img src="'+word.img+'" alt="'+word.text+'" style="height:1.3em;vertical-align:middle;border-radius:8px;margin-left:6px;object-fit:contain;">';
  }
  return word.emoji;
}

// ---------- Router / state ----------
const appEl = document.getElementById("app");
let currentScreen = "start";
let screenParams = {};
let history_stack = [];

function goTo(screen, params){
  stopSpeaking();
  history_stack.push({screen: currentScreen, params: screenParams});
  currentScreen = screen;
  screenParams = params || {};
  render();
}
function goHome(){
  stopSpeaking();
  history_stack = [];
  currentScreen = "menu";
  screenParams = {};
  render();
}
function goBack(){
  stopSpeaking();
  if(history_stack.length===0){ goHome(); return; }
  const prev = history_stack.pop();
  currentScreen = prev.screen;
  screenParams = prev.params;
  render();
}

// ---------- Topbar ----------
function renderTopbar(showBack){
  const bar = el("div","topbar");
  if(showBack){
    const back = el("button","nav-btn","⬅️ Voltar");
    back.onclick = goBack;
    bar.appendChild(back);
  } else {
    bar.appendChild(el("div","nav-spacer"));
  }
  const home = el("button","nav-btn icon-only","🏠");
  home.onclick = goHome;
  bar.appendChild(el("div","nav-spacer"));
  bar.appendChild(home);
  const audioToggle = el("button","nav-btn icon-only", settings.audioOn ? "🔊" : "🔇");
  audioToggle.onclick = ()=>{
    settings.audioOn = !settings.audioOn;
    if(!settings.audioOn) stopSpeaking();
    persistAll();
    render();
  };
  bar.appendChild(audioToggle);
  return bar;
}

  if(promptVisualEl) card.appendChild(promptVisualEl);

  const shuffled = shuffle(letters.map((l,i)=>({l, key:i})));

  letters.forEach(()=>targetRow.appendChild(el("div","target-slot","")));

  const banner = makeFeedbackBanner();

  shuffled.forEach(item=>{
    const tile = el("button","letter-tile", item.l);
    tile.onclick = async ()=>{
      // touch-based, order-forgiving: place this letter in the next empty correct slot if it matches
      if(item.l === letters[nextIndex]){
        const slot = targetRow.children[nextIndex];
        slot.textContent = item.l;

          showFeedback(banner, true);
          await speak("Muito bem!");

      }

    tilesRow.appendChild(tile);

  card.appendChild(banner);
  s.appendChild(card);
  return s;

// ---- Quebra-cabeça de letras (arrastar) ----
// A real drag-and-drop puzzle: letters sit in a tray and can be dragged onto
// slots to spell the word. A simple tap on a piece also auto-places it in
// the next correct empty slot, so dragging is fun but never required.
//
// Each piece is drawn as a true jigsaw silhouette — a tab or a blank on every
// side, built from the same curve math real puzzle generators use — instead
// of a plain rounded tile. Neighboring letters always interlock (a tab on
// one piece's edge is mirrored by a blank on the piece next to it), and each
// piece is tied to its own original position, exactly like a real puzzle
// piece that only fits one spot.
const PUZZLE_BASE_W = 64, PUZZLE_BASE_H = 78, PUZZLE_PAD = 20;
const PUZZLE_OUTER_W = PUZZLE_BASE_W + PUZZLE_PAD*2;
const PUZZLE_OUTER_H = PUZZLE_BASE_H + PUZZLE_PAD*2;
const PUZZLE_FILL = "#FCF4E4";
const PUZZLE_COLORS = ["#E8396F","#7C3AED","#C97A00","#1D8FD6","#149F62","#E4601A"];

function puzzleSeedSign(seed){
  const x = Math.sin(seed*999)*10000;
  return (x - Math.floor(x)) < 0.5 ? 1 : -1;
}

// Smooth tab/blank profile along an edge (t from 0 to 1): a rounded "head"
// bump with a gentle pinched "neck" on each side, built from raised-cosine
// domes — flat (zero-slope) at both the peak and where they meet the
// baseline — so the outline is a true round knob, never a sharp point.
function puzzleRaisedCosine(u, center, halfWidth){
  const d = Math.abs(u-center);
  if(d>=halfWidth) return 0;
  return 0.5*(1+Math.cos(Math.PI*d/halfWidth));
}
function puzzleBumpShape(t){
  return puzzleRaisedCosine(t, 0.5, 0.30);
}

function puzzleCatmullRom(points){
  let d = "";
  for(let i=0;i<points.length-1;i++){
    const p0 = points[i-1] || points[i];
    const p1 = points[i];
    const p2 = points[i+1];
    const p3 = points[i+2] || p2;
    const c1x = p1[0]+(p2[0]-p0[0])/6, c1y = p1[1]+(p2[1]-p0[1])/6;
    const c2x = p2[0]-(p3[0]-p1[0])/6, c2y = p2[1]-(p3[1]-p1[1])/6;
    d += `C ${c1x.toFixed(2)} ${c1y.toFixed(2)}, ${c2x.toFixed(2)} ${c2y.toFixed(2)}, ${p2[0].toFixed(2)} ${p2[1].toFixed(2)} `;
  }
  return d;
}

function puzzleEdgePoints(p0, p1, sign, normal, amp){
  const [x0,y0] = p0, [x1,y1] = p1;
  const dx = x1-x0, dy = y1-y0;
  const len = Math.hypot(dx,dy);
  const [nx,ny] = normal;
  const N = 28;
  const pts = [];
  for(let i=0;i<=N;i++){
    const t = i/N;
    const bx = x0+dx*t, by = y0+dy*t;
    const off = sign*puzzleBumpShape(t)*amp*len;
    pts.push([bx+nx*off, by+ny*off]);
  }
  return pts;
}

// Builds the SVG path for one jigsaw piece. `edges` gives the tab(+1)/
// blank(-1)/flat(0) direction for each of the 4 sides of the base rectangle.
function buildPieceOutlinePath(w, h, edges, ampLR, ampTB){
  const tl=[0,0], tr=[w,0], br=[w,h], bl=[0,h];
  const top = puzzleEdgePoints(tl, tr, edges.top, [0,-1], ampTB);
  const right = puzzleEdgePoints(tr, br, edges.right, [1,0], ampLR);
  const bottom = puzzleEdgePoints(br, bl, edges.bottom, [0,1], ampTB);
  const left = puzzleEdgePoints(bl, tl, edges.left, [-1,0], ampLR);
  const pts = [].concat(top, right.slice(1), bottom.slice(1), left.slice(1));
  let d = `M ${pts[0][0].toFixed(2)} ${pts[0][1].toFixed(2)} `;
  d += puzzleCatmullRom(pts);
  d += "Z";
  return d;
}

// Computes tab/blank edges for every letter position in a word so that each
// piece interlocks with its real neighbor (a shared boundary is always a tab
// on one side and a blank on the other) and reads as a jigsaw shape on every
// side, including the decorative top/bottom bumps.
function computePuzzleEdges(n){
  const boundary = [];
  for(let k=0;k<n-1;k++) boundary.push(puzzleSeedSign(k*17+5));
  const edges = [];
  for(let i=0;i<n;i++){
    edges.push({
      left: i===0 ? 0 : -boundary[i-1],
      right: i===n-1 ? 0 : boundary[i],
      top: puzzleSeedSign(i*13+3),
      bottom: puzzleSeedSign(i*29+11)
    });
  }
  return edges;
}

function makePieceSVG(edges, fill, pathClass){
  const d = buildPieceOutlinePath(PUZZLE_BASE_W, PUZZLE_BASE_H, edges, 0.22, 0.16);
  const svgNS = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(svgNS,"svg");
  svg.setAttribute("viewBox", `0 0 ${PUZZLE_OUTER_W} ${PUZZLE_OUTER_H}`);
  const g = document.createElementNS(svgNS,"g");
  g.setAttribute("transform", `translate(${PUZZLE_PAD},${PUZZLE_PAD})`);
  const path = document.createElementNS(svgNS,"path");
  path.setAttribute("d", d);
  path.setAttribute("fill", fill);
  path.setAttribute("class", pathClass);
  g.appendChild(path);
  svg.appendChild(g);
  return svg;
}

function renderPuzzleActivity(targetText, itemId, activityKey, promptLabel, promptVisualEl){
  const s = el("div","screen");
  s.appendChild(renderTopbar(true));
  const card = el("div","activity-card");
  card.appendChild(el("div","prompt", promptLabel));
  if(promptVisualEl) card.appendChild(promptVisualEl);

  const letters = targetText.split("");
  const pieceEdges = computePuzzleEdges(letters.length);

  const board = el("div","puzzle-board");
  const slotEls = letters.map((letter,i)=>{
    const slot = el("div","puzzle-slot");
    slot.style.width = PUZZLE_OUTER_W+"px";
    slot.style.height = PUZZLE_OUTER_H+"px";
    slot.dataset.index = i;
    slot.appendChild(makePieceSVG(pieceEdges[i], "rgba(255,255,255,.01)", "socket-path"));
    board.appendChild(slot);
    return slot;
  });

  const tray = el("div","puzzle-tray");
  const banner = makeFeedbackBanner();
  const btnRow = el("div","options-row");
  const nextBtn = el("button","big-btn small","AVANÇAR ➜");
  nextBtn.style.display = "none";
  btnRow.appendChild(nextBtn);

  card.appendChild(board);
  card.appendChild(tray);
  card.appendChild(banner);
  card.appendChild(btnRow);
  s.appendChild(card);

  const shuffledPieces = shuffle(letters.map((l,i)=>({l, i, key:i+"-"+Math.random()})));
  let filledCount = 0;
  let completed = false;

  function checkCompletion(){
    if(filledCount === letters.length && !completed){
      completed = true;
      showFeedback(banner, true);
      (async ()=>{
        await speak("Muito bem!");
        addStar(itemId);
        markActivityDone(activityKey);
        nextBtn.style.display = "";
      })();
    }
  }

  function placePiece(pieceEl, slot){
    // Move the piece itself into the slot so it visually "fills" the puzzle.
    pieceEl.style.position = "static";
    pieceEl.style.left = "";
    pieceEl.style.top = "";
    pieceEl.style.transform = "";
    pieceEl.classList.remove("dragging");
    pieceEl.classList.add("placed");
    pieceEl.onpointerdown = null;
    slot.appendChild(pieceEl);
    slot.classList.add("filled");
    slot.classList.remove("hover-target");
    filledCount++;
    speak(pieceEl.dataset.letter.toLowerCase());
    checkCompletion();
  }

  function returnPieceToTray(pieceEl){
    pieceEl.style.position = "static";
    pieceEl.style.left = "";
    pieceEl.style.top = "";
    pieceEl.style.transform = "";
    pieceEl.classList.remove("dragging");
    tray.appendChild(pieceEl);
  }

  function nudge(pieceEl){
    pieceEl.style.transform = "translateY(-6px)";
    setTimeout(()=>{ if(pieceEl) pieceEl.style.transform = ""; }, 200);
  }

  function findSlotAtPoint(x, y, pieceIndex){
    // Generous drop tolerance: the finger doesn't need to land exactly on
    // the slot, just reasonably close to it.
    const TOLERANCE = 30;
    let best = null, bestDist = Infinity;
    slotEls.forEach(slot=>{
      if(slot.classList.contains("filled")) return;
      const r = slot.getBoundingClientRect();
      const cx = r.left + r.width/2, cy = r.top + r.height/2;
      const withinBox = x >= r.left-TOLERANCE && x <= r.right+TOLERANCE && y >= r.top-TOLERANCE && y <= r.bottom+TOLERANCE;
      if(withinBox){
        const d = Math.hypot(x-cx, y-cy);
        if(d < bestDist){ bestDist = d; best = slot; }
      }
    });
    if(best && Number(best.dataset.index) === pieceIndex) return best;
    return null;
  }

  function autoPlace(pieceEl, pieceIndex){
    const slot = slotEls.find(sl=>!sl.classList.contains("filled") && Number(sl.dataset.index) === pieceIndex);
    if(slot){ placePiece(pieceEl, slot); }
    else { nudge(pieceEl); }
  }

  shuffledPieces.forEach(item=>{
    const piece = el("button","puzzle-piece");
    piece.style.width = PUZZLE_OUTER_W+"px";
    piece.style.height = PUZZLE_OUTER_H+"px";
    piece.dataset.letter = item.l;
    piece.appendChild(makePieceSVG(pieceEdges[item.i], PUZZLE_FILL, "piece-path"));
    const letterSpan = el("span","piece-letter", item.l);
    letterSpan.style.color = PUZZLE_COLORS[item.i % PUZZLE_COLORS.length];
    piece.appendChild(letterSpan);
    tray.appendChild(piece);

    let dragging = false, moved = false, startX=0, startY=0, origX=0, origY=0, pointerId=null;
    const DRAG_THRESHOLD = 10;

    piece.addEventListener("pointerdown", (e)=>{
      e.preventDefault();
      dragging = true; moved = false; pointerId = e.pointerId;
      try{ piece.setPointerCapture(pointerId); }catch(err){}
      const r = piece.getBoundingClientRect();
      startX = e.clientX; startY = e.clientY;
      origX = r.left; origY = r.top;
      piece.style.position = "fixed";
      piece.style.left = r.left+"px";
      piece.style.top = r.top+"px";
      piece.style.zIndex = 1000;
      piece.classList.add("dragging");
    });

    piece.addEventListener("pointermove", (e)=>{
      if(!dragging) return;
      const dx = e.clientX-startX, dy = e.clientY-startY;
      if(Math.abs(dx) > DRAG_THRESHOLD || Math.abs(dy) > DRAG_THRESHOLD) moved = true;
      piece.style.left = (origX+dx)+"px";
      piece.style.top = (origY+dy)+"px";
      slotEls.forEach(sl=>sl.classList.remove("hover-target"));
      if(moved){
        const target = findSlotAtPoint(e.clientX, e.clientY, item.i);
        if(target) target.classList.add("hover-target");
      }
    });

    function endDrag(e){
      if(!dragging) return;
      dragging = false;
      slotEls.forEach(sl=>sl.classList.remove("hover-target"));
      if(!moved){
        autoPlace(piece, item.i);
      } else {
        const target = findSlotAtPoint(e.clientX, e.clientY, item.i);
        if(target){ placePiece(piece, target); }
        else { returnPieceToTray(piece); }
      }
    }
    piece.addEventListener("pointerup", endDrag);
    piece.addEventListener("pointercancel", endDrag);
  });

  nextBtn.onclick = ()=>{ render(); };

  return s;
}

      await speak(correct ? "Muito bem!" : "Vamos tentar novamente!");
      await afterFeedbackPause();
      if(correct){
        addStar(w.id);
        markActivityDone("palavra-encontrar-"+w.id);
        render();
      } else {
        Array.from(optRow.children).forEach(c=>{c.disabled=false;c.classList.remove("wrong");});
        banner.classList.add("hide");
      }
    };
    optRow.appendChild(b);
  });

  card.appendChild(optRow);
  card.appendChild(banner);
  s.appendChild(card);
  speak(w.text);
  return s;
}

// ---- Generic choice activity (texto ou emoji nas opções) ----
function renderChoiceActivity(cfg){
  // cfg: { promptText, stimulusHtml, options:[{label, correct, speakOnCorrect}], ttsPrompt, onCorrect,
  //        isEmojiOptions, isLetterOptions, speakLetterBeforeFeedback: 'always'|'onWrong'|'never' }
  const s = el("div","screen");
  s.appendChild(renderTopbar(true));
  const card = el("div","activity-card");
  card.appendChild(el("div","prompt", cfg.promptText));

  if(cfg.stimulusHtml !== undefined){
    card.appendChild(el("div","stimulus", cfg.stimulusHtml));
  }
  if(cfg.audioText){
    const audioBtn = el("button","audio-btn","🔊");
    audioBtn.onclick = ()=>speak(cfg.audioText);
    card.appendChild(audioBtn);
  }

  const optRow = el("div","options-row");
  const banner = makeFeedbackBanner();

  cfg.options.forEach(opt=>{
    const b = el("button","option-btn", opt.imgSrc ? "" : opt.label);
    if(opt.imgSrc){
      const img = document.createElement("img");
      img.src = opt.imgSrc;
      img.alt = opt.label || "";
      img.className = "word-photo";
      b.appendChild(img);
    }
    if(cfg.isEmojiOptions) b.style.fontSize = "2.6rem";
    if(cfg.isLetterOptions) b.classList.add("big-letter");
    b.onclick = async ()=>{
      Array.from(optRow.children).forEach(c=>c.disabled=true);
      b.classList.add(opt.correct?"correct":"wrong");
      showFeedback(banner, opt.correct);
      const speakLetterMode = cfg.speakLetterBeforeFeedback || "never";
      if(opt.correct){
        if(speakLetterMode === "always") await speak(opt.label.toLowerCase());
        await speak(opt.speakOnCorrect || "Muito bem!");
        cfg.onCorrect && cfg.onCorrect();
        await afterFeedbackPause();
        render();
      } else {
        if(speakLetterMode === "always" || speakLetterMode === "onWrong") await speak(opt.label.toLowerCase());
        await speak("Vamos tentar novamente!");
        await afterFeedbackPause();
        Array.from(optRow.children).forEach(c=>{c.disabled=false;c.classList.remove("wrong");});
        banner.classList.add("hide");
      }
    };
    optRow.appendChild(b);
  });

  card.appendChild(optRow);
  card.appendChild(banner);
  s.appendChild(card);
  if(cfg.ttsPrompt) speak(cfg.ttsPrompt);
  return s;
}

const ALPHABET = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
function randomDistractorLetters(exclude, count){
  const pool = ALPHABET.filter(l=>!exclude.includes(l));
  return shuffle(pool).slice(0,count);
}

function renderEscritaLivre(){
  const w = words.find(x=>x.id===screenParams.wordId);
  const s = el("div","screen");
  s.appendChild(renderTopbar(true));
  const card = el("div","activity-card");
  card.appendChild(el("div","prompt","TENTE ESCREVER:"));
  card.appendChild(el("div","word-display", w.text));

  const audioBtn = el("button","audio-btn","🔊");
  audioBtn.onclick = ()=>speak(w.text);
  card.appendChild(audioBtn);

  const wrap = el("div","tracing-wrap");
  const drawCanvas = document.createElement("canvas");
  wrap.appendChild(drawCanvas);
  card.appendChild(wrap);

  const banner = makeFeedbackBanner();
  banner.classList.remove("hide");
  banner.textContent = "Desenhe livremente com o dedo. Não precisa ficar perfeito!";
  card.appendChild(banner);

  const btnRow = el("div","options-row");
  const clearBtn = el("button","big-btn small sun","🔄 LIMPAR");
  const doneBtn = el("button","big-btn small","✔ CONCLUIR");
  btnRow.appendChild(clearBtn);
  btnRow.appendChild(doneBtn);
  card.appendChild(btnRow);
  s.appendChild(card);

  let W=0,H=0,DPR=1, drawing=false, lastPt=null;
  function setup(){
    const rect = wrap.getBoundingClientRect();
    W=rect.width; H=rect.height; DPR = window.devicePixelRatio||1;
    drawCanvas.width = W*DPR; drawCanvas.height = H*DPR;
    const ctx = drawCanvas.getContext("2d");
    ctx.setTransform(DPR,0,0,DPR,0,0);
  }
  function getPos(e){
    const rect = drawCanvas.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    return {x: clientX-rect.left, y: clientY-rect.top};
  }
  function dot(x,y){
    const ctx = drawCanvas.getContext("2d");
    ctx.fillStyle="rgba(42,169,160,0.9)";
    ctx.beginPath(); ctx.arc(x,y,9,0,Math.PI*2); ctx.fill();
  }
  function line(x0,y0,x1,y1){
    const ctx = drawCanvas.getContext("2d");
    ctx.strokeStyle="rgba(42,169,160,0.9)";
    ctx.lineWidth=18; ctx.lineCap="round";
    ctx.beginPath(); ctx.moveTo(x0,y0); ctx.lineTo(x1,y1); ctx.stroke();
  }
  function down(e){ e.preventDefault(); drawing=true; const p=getPos(e); dot(p.x,p.y); lastPt=p; }
  function move(e){ if(!drawing) return; e.preventDefault(); const p=getPos(e); if(lastPt) line(lastPt.x,lastPt.y,p.x,p.y); lastPt=p; }
  function up(){ drawing=false; lastPt=null; }

  drawCanvas.addEventListener("pointerdown", down);
  drawCanvas.addEventListener("pointermove", move);
  window.addEventListener("pointerup", up);
  drawCanvas.addEventListener("touchstart", down, {passive:false});
  drawCanvas.addEventListener("touchmove", move, {passive:false});
  drawCanvas.addEventListener("touchend", up);

  clearBtn.onclick = ()=>{
    const ctx = drawCanvas.getContext("2d");
    ctx.clearRect(0,0,W,H);
  };
  doneBtn.onclick = async ()=>{
    addStar(w.id);
    markActivityDone("palavra-livre-"+w.id);
    banner.textContent = "⭐ VOCÊ CONSEGUIU!";
    await speak("Você conseguiu!");
    await afterFeedbackPause();
    render();
  };

  requestAnimationFrame(setup);
  return s;
}

// ---------- TRACING ENGINE ----------
// Renders a big letter/word as a guide, samples a grid of "guide points" from its
// drawn shape, and marks them covered as the student's finger passes nearby with
// a wide tolerance radius. No precision is required.
function renderTracingScreen(targetText, itemId, activityKey, promptLabel){
  const s = el("div","screen");
  s.appendChild(renderTopbar(true));
  const card = el("div","activity-card");
  card.appendChild(el("div","prompt", promptLabel));

  const progressOuter = el("div","progress-bar-outer");
  const progressInner = el("div","progress-bar-inner");
  progressOuter.appendChild(progressInner);
  card.appendChild(progressOuter);

  const wrap = el("div","tracing-wrap");
  const guideCanvas = document.createElement("canvas");
  const drawCanvas = document.createElement("canvas");
  wrap.appendChild(guideCanvas);
  wrap.appendChild(drawCanvas);
  card.appendChild(wrap);

  const banner = makeFeedbackBanner();
  card.appendChild(banner);

  const btnRow = el("div","options-row");
  const repeatBtn = el("button","big-btn small sun","🔄 REPETIR");
  const nextBtn = el("button","big-btn small","AVANÇAR ➜");
  nextBtn.style.display = "none";
  btnRow.appendChild(repeatBtn);
  btnRow.appendChild(nextBtn);
  card.appendChild(btnRow);

  s.appendChild(card);

  let guidePoints = [];
  let covered = [];
  let letterBounds = [];
  let W=0,H=0, DPR=1;
  const TOLERANCE = settings.tolerance || 34;

  function setupCanvases(){
    const rect = wrap.getBoundingClientRect();
    W = rect.width; H = rect.height;
    DPR = window.devicePixelRatio || 1;
    [guideCanvas, drawCanvas].forEach(c=>{
      c.width = W*DPR; c.height = H*DPR;
      const ctx = c.getContext("2d");
      ctx.setTransform(DPR,0,0,DPR,0,0);
    });
    drawGuide();
    buildGuidePoints();
    clearDraw();
  }

  function drawGuide(){
    const ctx = guideCanvas.getContext("2d");
    ctx.clearRect(0,0,W,H);
    ctx.fillStyle = "#B7D8EA";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    // Start from a generous size, then measure and shrink until the text
    // actually fits inside the canvas (with padding), so longer/wider
    // words like "AMOR" never get cut off.
    const maxWidth = W * 0.86;
    const maxHeight = H * 0.5;
    let fontSize = maxHeight;
    ctx.font = "800 "+fontSize+"px 'Baloo 2', sans-serif";
    let textWidth = ctx.measureText(targetText).width;
    while(textWidth > maxWidth && fontSize > 10){
      fontSize -= 2;
      ctx.font = "800 "+fontSize+"px 'Baloo 2', sans-serif";
      textWidth = ctx.measureText(targetText).width;
    }

    ctx.fillText(targetText, W/2, H/2);
    // starting point marker (first letter's left area)
    ctx.fillStyle = "#7CD68C";
    ctx.beginPath();
    const leftX = W/2 - textWidth/2;
    const startX = leftX + 6;
    ctx.arc(startX, H/2 + fontSize*0.28, 9, 0, Math.PI*2);
    ctx.fill();

    // Record each letter's horizontal span (in CSS-pixel space) so we can
    // later require the student to actually pass over every letter, not
    // just accumulate coverage anywhere on the canvas.
    letterBounds = [];
    let prevWidth = 0;
    for(let i=0;i<targetText.length;i++){
      const wIncl = ctx.measureText(targetText.slice(0,i+1)).width;
      letterBounds.push({start: leftX+prevWidth, end: leftX+wIncl});
      prevWidth = wIncl;
    }
  }

  function letterIndexForX(x){
    for(let i=0;i<letterBounds.length;i++){
      if(x >= letterBounds[i].start && x <= letterBounds[i].end) return i;
    }
    let nearest = 0, bestDist = Infinity;
    letterBounds.forEach((b,i)=>{
      const mid = (b.start+b.end)/2;
      const d = Math.abs(x-mid);
      if(d < bestDist){ bestDist = d; nearest = i; }
    });
    return nearest;
  }

  function buildGuidePoints(){
    const ctx = guideCanvas.getContext("2d");
    const img = ctx.getImageData(0,0,W*DPR,H*DPR).data;
    guidePoints = [];
    const step = Math.max(6, Math.floor(6*DPR));
    for(let y=0; y<H*DPR; y+=step){
      for(let x=0; x<W*DPR; x+=step){
        const idx = (y*W*DPR + x)*4;
        const alpha = img[idx+3];
        if(alpha > 60){
          const cssX = x/DPR;
          guidePoints.push({x:cssX, y:y/DPR, hit:false, letter:letterIndexForX(cssX)});
        }
      }
    }
    covered = guidePoints;
    updateProgress();
  }

  function clearDraw(){
    const ctx = drawCanvas.getContext("2d");
    ctx.clearRect(0,0,W,H);
  }

  function updateProgress(){
    if(guidePoints.length===0) return 0;
    const hitCount = guidePoints.filter(p=>p.hit).length;
    const pct = Math.round((hitCount/guidePoints.length)*100);
    progressInner.style.width = pct+"%";
    return pct;
  }

  // Every letter that has any guide pixels must reach at least minPct
  // coverage — this stops a single quick swipe across the middle of the
  // word from being counted as "finished" before the edges are traced.
  function allLettersCovered(minPct){
    if(letterBounds.length===0) return true;
    for(let i=0;i<letterBounds.length;i++){
      const pts = guidePoints.filter(p=>p.letter===i);
      if(pts.length===0) continue;
      const hit = pts.filter(p=>p.hit).length;
      if((hit/pts.length) < minPct) return false;
    }
    return true;
  }

  let drawing = false;
  const drawCtx = ()=>drawCanvas.getContext("2d");

  function paintDot(x,y){
    const ctx = drawCtx();
    ctx.fillStyle = "rgba(255,140,107,0.85)";
    ctx.beginPath();
    ctx.arc(x,y,10,0,Math.PI*2);
    ctx.fill();
  }
  function paintLine(x0,y0,x1,y1){
    const ctx = drawCtx();
    ctx.strokeStyle = "rgba(255,140,107,0.85)";
    ctx.lineWidth = 20;
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(x0,y0);
    ctx.lineTo(x1,y1);
    ctx.stroke();
  }

  function markCoverage(x,y){
    let changed = false;
    for(const p of guidePoints){
      if(p.hit) continue;
      const dx = p.x-x, dy = p.y-y;
      if(dx*dx+dy*dy <= TOLERANCE*TOLERANCE){
        p.hit = true;
        changed = true;
      }
    }
    if(changed){
      const pct = updateProgress();
      if(pct >= 85 && allLettersCovered(0.45) && nextBtn.style.display === "none"){
        completeTracing();
      }
    }
  }

  let completed = false;
  function completeTracing(){
    if(completed) return;
    completed = true;
    showFeedback(banner, true);
    banner.textContent = "⭐ MUITO BEM!";
    speak("Muito bem!");
    addStar(itemId);
    markActivityDone(activityKey);
    nextBtn.style.display = "";
  }

  let lastPt = null;
  function getPos(e){
    const rect = drawCanvas.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    return {x: clientX-rect.left, y: clientY-rect.top};
  }
  function pointerDown(e){
    e.preventDefault();
    drawing = true;
    const p = getPos(e);
    paintDot(p.x,p.y);
    markCoverage(p.x,p.y);
    lastPt = p;
  }
  function pointerMove(e){
    if(!drawing) return;
    e.preventDefault();
    const p = getPos(e);
    if(lastPt){ paintLine(lastPt.x,lastPt.y,p.x,p.y); }
    markCoverage(p.x,p.y);
    lastPt = p;
  }
  function pointerUp(e){
    drawing = false;
    lastPt = null;
  }

  drawCanvas.addEventListener("pointerdown", pointerDown);
  drawCanvas.addEventListener("pointermove", pointerMove);
  window.addEventListener("pointerup", pointerUp);
  // touch fallbacks
  drawCanvas.addEventListener("touchstart", pointerDown, {passive:false});
  drawCanvas.addEventListener("touchmove", pointerMove, {passive:false});
  drawCanvas.addEventListener("touchend", pointerUp);

  repeatBtn.onclick = ()=>{
    completed = false;
    nextBtn.style.display = "none";
    banner.classList.add("hide");
    guidePoints.forEach(p=>p.hit=false);
    updateProgress();
    clearDraw();
  };
  nextBtn.onclick = ()=>{ render(); };

  // Defer sizing until element is attached to DOM. If the custom font is
  // still loading, wait for it (so text-width measurements used to size
  // and center the guide are accurate) but never redo setup once the
  // student has already started tracing, since that would wipe progress.
  if(document.fonts && document.fonts.ready){
    document.fonts.ready.then(()=>{ if(!drawing && !completed) setupCanvases(); });
  }
  requestAnimationFrame(()=>{ setupCanvases(); });

  return s;
}

    persistAll();
    txtInput.value=""; emojiInput.value="";
    render();
  };
  addRow.appendChild(txtInput);
  addRow.appendChild(emojiInput);
  addRow.appendChild(addBtn);
  panel2.appendChild(addRow);
  s.appendChild(panel2);

  // Settings
  const panel3 = el("div","teacher-panel");
  panel3.appendChild(el("h3","Configurações"));

  const audioField = el("div","field-row");
  audioField.appendChild(el("label","","Som"));
  const audioSelect = document.createElement("select");
  ["Ativado","Desativado"].forEach((opt,i)=>{
    const o = document.createElement("option");
    o.value = i===0?"on":"off";
    o.textContent = opt;
    if((settings.audioOn && i===0)||(!settings.audioOn && i===1)) o.selected=true;
    audioSelect.appendChild(o);
  });
  audioSelect.onchange = ()=>{ settings.audioOn = audioSelect.value==="on"; persistAll(); };
  audioField.appendChild(audioSelect);
  panel3.appendChild(audioField);

  const tolField = el("div","field-row");
  tolField.appendChild(el("label","","Tolerância do traçado"));
  const tolSelect = document.createElement("select");
  [["Padrão (recomendado)",34],["Mais fácil",48],["Um pouco mais exigente",22]].forEach(([label,val])=>{
    const o = document.createElement("option");
    o.value = val; o.textContent = label;
    if((settings.tolerance||34) === val) o.selected = true;
    tolSelect.appendChild(o);
  });
  tolSelect.onchange = ()=>{ settings.tolerance = parseInt(tolSelect.value); persistAll(); };
  tolField.appendChild(tolSelect);
  panel3.appendChild(tolField);

  const pinField = el("div","field-row");
  pinField.appendChild(el("label","","Alterar PIN (4 dígitos)"));
  const pinInput = document.createElement("input");
  pinInput.type="text"; pinInput.maxLength=4; pinInput.value=settings.pin;
  pinInput.onchange = ()=>{
    if(/^\d{4}$/.test(pinInput.value)){ settings.pin = pinInput.value; persistAll(); }
  };
  pinField.appendChild(pinInput);
  panel3.appendChild(pinField);

  const resetBtn = el("button","small-btn danger","Reiniciar progresso da aluna");
  resetBtn.style.marginTop="8px";
  resetBtn.onclick = ()=>{
    progress = { stars:{NOME:0}, activities:{} };
    persistAll();
    render();
  };
  panel3.appendChild(resetBtn);

  const lockBtn = el("button","small-btn","Sair da Área da Professora");
  lockBtn.onclick = ()=>{ teacherUnlocked=false; goHome(); };
  panel3.appendChild(lockBtn);

  s.appendChild(panel3);
  return s;
}

// ---------- Main render dispatcher ----------
const SCREENS = {
  "start": renderStart,
  "menu": renderMenu,
  "nome-menu": renderNomeMenu,
  "nome-encontrar": renderNomeEncontrar,
  "nome-letra": renderNomeLetra,
  "nome-primeira-letra": renderNomePrimeiraLetra,
  "nome-montar": renderNomeMontar,
  "nome-puzzle": renderNomePuzzle,
  "nome-completar": renderNomeCompletar,
  "nome-tracar": renderNomeTracar,
  "palavras-menu": renderPalavrasMenu,
  "palavra-atividades": renderPalavraAtividades,
  "palavra-encontrar": renderPalavraEncontrar,
  "palavra-ouvir": renderPalavraOuvir,
  "palavra-montar": renderPalavraMontar,
  "palavra-puzzle": renderPalavraPuzzle,
  "palavra-completar": renderPalavraCompletar,
  "palavra-tracar": renderPalavraTracar,
  "palavra-livre": renderEscritaLivre,
  "escrever-menu": renderEscreverMenu,
  "evolucao": renderEvolucao,
  "professora": renderProfessora,
};

function render(){
  appEl.innerHTML = "";
  const fn = SCREENS[currentScreen] || renderMenu;
  appEl.appendChild(fn());
}

render();
</script>
